# if you want to use this file in your actual tool changer then remove the `example_` from the filename.


# This file contains common pin mappings for the BIGTREETECH EBBT0
# Canbus board. To use this config, the firmware should be compiled for the
# STM32G0B1 with "8 MHz crystal" and "USB (on PA11/PA12)" or "CAN bus (on PB0/PB1)".
# The "EBB Can" micro-controller will be used to control the components on the nozzle.

# See docs/Config_Reference.md for a description of parameters.

[mcu EBBT0]
canbus_uuid: 469c828b82b1
# python3 ~/katapult/scripts/flashtool.py -i can0 -u ac5f7df1a805 -r
# python3 ~/katapult/scripts/flashtool.py -i can0 -u ac5f7df1a805 -f ~/klipper/out/klipper.bin

[temperature_sensor THB0_temp]
sensor_type: Generic 3950
sensor_pin: EBBT0: PA0
pullup_resistor: 2200

[lis2dw]
cs_pin: EBBT0: PB1
spi_software_sclk_pin: EBBT0: PB10
spi_software_mosi_pin: EBBT0: PB11
spi_software_miso_pin: EBBT0: PB2
axes_map: x,z,y

[extruder]
step_pin: EBBT0: PD14
dir_pin: EBBT0: PA8
enable_pin: !EBBT0: PB6
heater_pin: EBBT0: PB4
sensor_pin: EBBT0: PA3
sensor_type: PT1000
pullup_resistor: 2200
full_steps_per_rotation: 200
microsteps: 32
rotation_distance: 4.637 #Orbiter 2.5
nozzle_diameter: 0.400
filament_diameter: 1.750
control: pid
pid_Kp=41.304
pid_Ki=7.246
pid_Kd=58.861
max_extrude_cross_section: 10
max_extrude_only_distance: 1400
max_extrude_only_velocity: 120
max_extrude_only_accel: 1500
min_temp: 0
max_temp: 320

[tmc2209 extruder]
uart_pin: EBBT0: PB3
run_current: 0.75
sense_resistor: 0.11
stealthchop_threshold: 0

[heater_fan T0_hotend_fan]
pin: EBBT0: PD2
heater: extruder
heater_temp: 50.0
tachometer_pin: EBBT0:PA4

[multi_pin fanT0]
pins: EBBT0:PD3,EBBT0:PA5

[fan_generic T0_partfan]
pin: multi_pin:fanT0

[gcode_macro T0]
variable_active: 0
variable_color: ""
gcode:
    SELECT_TOOL T=0

#change the tool numbers to the tool you are configuring, ie T0, T1, etc
[tool T0]
tool_number: 0
extruder: extruder
fan: T0_partfan
# Tool offset is 0,0,0
gcode_x_offset: 0
gcode_y_offset: 0
gcode_z_offset: 0
#These are build specific, its where the tool is sititng in it's dock.
params_park_x: 23.3
params_park_y: 10.5
params_park_z: 297
# For InputShaper run per tool and enter the frequency here
params_input_shaper_type_x: 'ei'
params_input_shaper_freq_x: 63.4  #accel - 7360
params_input_damping_ratio_x: 0.028
params_input_shaper_type_y: 'ei'
params_input_shaper_freq_y: 73.6  #accel - 9940
params_input_damping_ratio_y: 0.043

[tool_probe T0]
pin: ^EBBT0:PB8
tool: 0
x_offset: 0 # X axis-sensor relative nozzle offset
y_offset: 0 # Y axis-sensor relative nozzle offset
# More positive = More Squish  #-0.835
z_offset = -0.995
#z_offset = -1.290 #-1.390 # SMOOTH PLATE
speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder TEMP=150

# [filament_switch_sensor T0_filament_sensor]
# switch_pin: FS1
# pause_on_runout: TRUE
# runout_gcode:
#   M117 Runout sensor T0 reports: Runout
#   # SET_GCODE_VARIABLE MACRO=T0 VARIABLE=filament_consumed VALUE=1
# insert_gcode:
#   M117 Runout sensor T0 reports: Filament Detected
#   # SET_GCODE_VARIABLE MACRO=T0 VARIABLE=filament_consumed VALUE=0

#####################################################################
# 	LEDS
#####################################################################

[neopixel T0_leds]
pin: EBBT0:PC7
#   The pin connected to the neopixel. This parameter must be provided.
chain_count: 3
#   The number of Neopixel chips that are "daisy chained" to the
#   provided pin. The default is 1 (which indicates only a single
#   Neopixel is connected to the pin).
color_order: GRBW
#   Set the pixel order required by the LED hardware. Options are GRB,
#   RGB, GRBW, or RGBW. The default is GRB.
initial_RED: 1.0
initial_GREEN: 0.0
initial_BLUE: 1.0
initial_WHITE: 0.0
#   Sets the initial LED color of the Neopixel. Each value should be
#   between 0.0 and 1.0. The WHITE option is only available on RGBW
#   LEDs. The default for each color is 0.#
  