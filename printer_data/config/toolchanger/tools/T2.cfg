# This file contains common pin mappings for the BIGTREETECH EBB36 Gen2 V1.0.
# To use this config, the firmware should be compiled for the 
# STM32G0B1 with "8 MHz crystal" and "CAN bus (on PB12/PB13)".

# change the mcu section name to the tool board you are configuring:
# EBB0, EBB1, etc.
[mcu EBB2]
canbus_uuid: 010e82e94cf6
# python3 ~/katapult/scripts/flashtool.py -i can0 -u ac5f7df1a805 -r
# python3 ~/katapult/scripts/flashtool.py -i can0 -u ac5f7df1a805 -f ~/klipper/out/klipper.bin

[temperature_sensor EBB2_temp]
sensor_type: Generic 3950
sensor_pin: EBB2: PA0
pullup_resistor: 2200

# change the accelerometer section name to the tool you are configuring:
# T0, T1, etc.
[lis2dw T2]
cs_pin: EBB2:PB1
spi_software_sclk_pin: EBB2:PB10
spi_software_mosi_pin: EBB2:PB11
spi_software_miso_pin: EBB2:PB2
axes_map: x,y,z

# change to the extruder section you are configuring:
# extruder, extruder1, etc.
[extruder2] # Orbiter2.5 with Dragon ACE Hotend
step_pin: EBB2:PB14
dir_pin: EBB2:PA8
enable_pin: !EBB2:PB6
heater_pin: EBB2:PB4
sensor_pin: EBB2:PA3
pullup_resistor: 2200
microsteps: 16
rotation_distance: 4.69
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
min_temp: 0
max_temp: 290
pressure_advance: 0.03
sensor_type: PT1000
# max_extrude_cross_section: 10
# max_extrude_only_distance: 1400
# max_extrude_only_velocity: 120
# max_extrude_only_accel: 1500
control: pid
pid_Kp: 18.000 # Reduce gain to make response gentler
pid_Ki: 2.400  # Reduce accumulated correction
pid_Kd: 20     # Increase damping to resist sharp swings

# change the tmc2209 section name to match the extruder you are configuring:
# extruder, extruder1, etc.
[tmc2209 extruder2] # Orbiter2.5
uart_pin: EBB2:PB3
run_current: 0.85
stealthchop_threshold: 0

# change the heater_fan section name to match the tool you are configuring:
# T0_hotend_fan, T1_hotend_fan, etc.
[heater_fan T2_hotend_fan]
pin: EBB2:PD2
heater: extruder2 # change to match the extruder you are configuring: extruder, extruder1, etc.
heater_temp: 50.0
tachometer_pin: EBB2:PA4
tachometer_ppr: 2
tachometer_poll_interval: 0.0005

[multi_pin T2_multipin]
pins: EBB2:PD3, EBB2:PA5

# change the fan_generic section name to the tool you are configuring:
# T0_partfan, T1_partfan, etc.
[fan_generic T2_part_fan]
pin: multi_pin:T2_multipin

# change the tool section name to the tool you are configuring:
# T0, T1, etc.
[tool T2]
tool_number: 2 # change to the index of the tool. 0, 1, 2, etc.
extruder: extruder2 # change to match the extruder you are configuring: extruder, extruder1, etc.
fan: T2_part_fan
params_park_x: 0 # The absolute X-position of the tool in its dock.
params_park_y: 0 # The absolute Y-position of the tool in its dock.
params_park_z: 0 # The absolute Z-position where the tool and shuttle mate in the dock, determined when the TAP (or Z-probe) triggers.
gcode_x_offset: 0 # The X-Axis offset of the nozzle's orifice in relation to tool 0
gcode_y_offset: 0 # The Y-Axis offset of the nozzle's orifice in relation to tool 0
gcode_z_offset: 0 # The Z-Axis offset of the nozzle's orifice in relation to tool 0

# Results from input shaper
# Uncomment the following lines if you have input shaper results for this tool
# params_input_shaper_freq_x: 50.0
# params_input_shaper_type_x: 'mzv'
# params_input_shaper_damping_ratio_x: 0.15
# params_input_shaper_freq_y: 50.0
# params_input_shaper_type_y: 'mzv'
# params_input_shaper_damping_ratio_y: 0.15

# change the tool_probe section name to the tool you are configuring:
# T0, T1, etc.
[tool_probe T2]
pin: ^EBB2:PB8
tool: 2 # change to the index of the tool. 0, 1, 2, etc.
z_offset: 0 # Needs to be calibrated. More positive = More Squish
speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder2 TEMP=150  # change to match the extruder you are configuring: extruder, extruder1, etc.

# change the neopixel section name to the tool you are configuring:
# T0, T1, etc.
[neopixel T2]
pin: EBB2:PC7
color_order: GRBW
chain_count: 3
initial_RED: 0.5
initial_GREEN: 0.0
initial_BLUE: 0.5
initial_WHITE: 0.0

# [filament_switch_sensor T2_filament_sensor]
# switch_pin: FS3
# pause_on_runout: TRUE
# runout_gcode:
#   M117 Runout sensor T2 reports: Runout
#   # SET_GCODE_VARIABLE MACRO=T2 VARIABLE=filament_consumed VALUE=1
# insert_gcode:
#   M117 Runout sensor T2 reports: Filament Detected
#   # SET_GCODE_VARIABLE MACRO=T2 VARIABLE=filament_consumed VALUE=0

# change the gcode_macro section name to the tool you are configuring:
# T0, T1, etc.
[gcode_macro T2]
variable_active: 0 # Must be zero.
variable_color: "" # Leave empty
gcode:
    SELECT_TOOL T=2 # change to the index of the tool. 0, 1, 2, etc.