# if you want to use this file in your actual tool changer then remove the `example_` from the filename.

# This file contains common pin mappings for the BIGTREETECH EBBT2
# Canbus board. To use this config, the firmware should be compiled for the
# STM32G0B1 with "8 MHz crystal" and "USB (on PA11/PA12)" or "CAN bus (on PB0/PB1)".
# The "EBB Can" micro-controller will be used to control the components on the nozzle.

# See docs/Config_Reference.md for a description of parameters.

[mcu EBBT2]
canbus_uuid: 010e82e94cf6
# python3 ~/katapult/scripts/flashtool.py -i can0 -u 8170dfa83388 -r
# python3 ~/katapult/scripts/flashtool.py -i can0 -u 8170dfa83388 -f ~/klipper/out/klipper.bin

[lis2dw]
cs_pin: EBBT2: PB1
spi_software_sclk_pin: EBBT2: PB10
spi_software_mosi_pin: EBBT2: PB11
spi_software_miso_pin: EBBT2: PB2
axes_map: x,z,y

[extruder2]
step_pin: EBBT2: PD13
dir_pin: EBBT2: PA8
enable_pin: !EBBT2: PB6
heater_pin: EBBT2: PB4
sensor_pin: EBBT2: PA3
sensor_type: PT1000
pullup_resistor: 2200
full_steps_per_rotation: 200
microsteps: 32
rotation_distance: 4.637 #Orbiter 2.5
nozzle_diameter: 0.400
filament_diameter: 1.750
control: pid
pid_Kp: 41.806 
pid_Ki: 13.934 
pid_Kd: 31.356
max_extrude_cross_section: 10
max_extrude_only_distance: 1400
max_extrude_only_velocity: 120
max_extrude_only_accel: 1500
min_temp: 0
max_temp: 350

[tmc2209 extruder2]
uart_pin: EBBT2: PB3
run_current: 0.75
sense_resistor: 0.11
stealthchop_threshold: 0

[heater_fan T2_hotend_fan]
pin: EBBT2: PD2
heater: extruder2
heater_temp: 50.0
tachometer_pin: EBBT2:PA4

[multi_pin fanT2]
pins: EBBT2:PD3,EBBT2:PA5

[fan_generic T2_partfan]
pin: multi_pin:fanT2

[gcode_macro T2]
variable_active: 0
variable_color: ""
gcode:
    SELECT_TOOL T=2

#change the tool numbers to the tool you are configuring, ie T1, T1, etc
[tool T2]
tool_number: 2
extruder: extruder2
fan: T2_partfan
# Tool offset is 0.171875,-0.034375,-0.833750
gcode_x_offset: -0.101563
gcode_y_offset: -0.335938
gcode_z_offset: -0.578750
#These are build specific, its where the tool is sititng in it's dock.
params_park_x: 173.9
params_park_y: 10
params_park_z: 298
# For InputShaper run per tool and enter the frequency here
params_input_shaper_type_x: 'ei'
params_input_shaper_freq_x: 62.6  #accel - 7180
params_input_damping_ratio_x: 0.033
params_input_shaper_type_y: 'ei'
params_input_shaper_freq_y: 65.6  #accel - 7890
params_input_damping_ratio_y: 0.038

[tool_probe T2]
pin: ^EBBT2:PB8
tool: 2
x_offset: 0 # X axis-sensor relative nozzle offset
y_offset: 0 # Y axis-sensor relative nozzle offset
z_offset: 0 # Z axis-sensor relative nozzle offset
# drop_first_result: True # enable is on danger-klipper
speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder2

# [filament_switch_sensor T2_filament_sensor]
# switch_pin: FS3
# pause_on_runout: TRUE
# runout_gcode:
#   M117 Runout sensor T2 reports: Runout
#   # SET_GCODE_VARIABLE MACRO=T2 VARIABLE=filament_consumed VALUE=1
# insert_gcode:
#   M117 Runout sensor T2 reports: Filament Detected
#   # SET_GCODE_VARIABLE MACRO=T2 VARIABLE=filament_consumed VALUE=0

#####################################################################
# 	LEDS
#####################################################################

[neopixel T2_leds]
pin: EBBT2:PC7
#   The pin connected to the neopixel. This parameter must be provided.
chain_count: 3
#   The number of Neopixel chips that are "daisy chained" to the
#   provided pin. The default is 1 (which indicates only a single
#   Neopixel is connected to the pin).
color_order: GRBW
#   Set the pixel order required by the LED hardware. Options are GRB,
#   RGB, GRBW, or RGBW. The default is GRB.
initial_RED: 1.0
initial_GREEN: 0.0
initial_BLUE: 1.0
initial_WHITE: 0.0
#   Sets the initial LED color of the Neopixel. Each value should be
#   between 0.0 and 1.0. The WHITE option is only available on RGBW
#   LEDs. The default for each color is 0.#
  